name: Legacy Python regression

on:
  push:
    branches: [main]
    paths: ['workbench/**', 'tests/**', 'pytest.ini', 'requirements.txt', 'repair.py', 'jsonc_utils.py', '.github/workflows/python-app.yml']
  pull_request:
    branches: [main]
    paths: ['workbench/**', 'tests/**', 'pytest.ini', 'requirements.txt', 'repair.py', 'jsonc_utils.py', '.github/workflows/python-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Verify Linux Codex history migration with real symlinks and SQLite
        run: python -m unittest discover -s tests -p test_codex_history.py -v
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Run Python regression tests (Windows GUI and DPAPI required)
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
