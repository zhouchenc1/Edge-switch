name: Tauri desktop checks

on:
  push:
    branches: [main]
    tags: ['v2.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: 'true'
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - run: npx prettier --check src scripts package.json tsconfig.json vite.config.ts vitest.config.ts src-tauri/tauri.conf.json src-tauri/capabilities/main.json
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") { throw 'Tag does not match source version' }
      - name: Build installer and portable archive
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Exercise packaged desktop through WebView2
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-switch-windows-alpha
          path: |
            dist/tauri/*
            build/tauri-build.log
            build/migration/desktop-*/result.json
            build/migration/desktop-*/*.png
          if-no-files-found: warn
